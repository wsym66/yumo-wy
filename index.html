<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>予墨游戏 · 在线玩</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- 登录视图 -->
  <section id="login-view" class="view active">
    <div class="status-pill">予墨游戏 — 在线玩</div>

    <div class="login-card">
      <div class="login-title">登录</div>

      <div class="login-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="6" y1="11" x2="10" y2="11"/>
          <line x1="8" y1="9" x2="8" y2="13"/>
          <line x1="15" y1="12" x2="15.01" y2="12"/>
          <line x1="18" y1="10" x2="18.01" y2="10"/>
          <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17.5 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"/>
        </svg>
      </div>

      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <input type="text" id="username" placeholder="账号" autocomplete="off">
      </div>

      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <input type="password" id="password" placeholder="密码">
      </div>

      <div class="btn-row">
        <button class="btn-login" onclick="doLogin()">登 录</button>
        <button class="btn-guest" onclick="openGuestModal()">访客进入</button>
      </div>
      <div class="err" id="errMsg"></div>
    </div>

    <div class="copyright">© 2026 予墨</div>
  </section>

  <!-- 首页视图 -->
  <section id="home-view" class="view">
    <div class="top-bar">
      <div class="title">予墨游戏 — 在线玩</div>
      <div class="btn-logout" onclick="doLogout()" title="退出登录">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </div>
    </div>

    <div class="game-row">
      <div class="game-name">和平精英</div>
      <span class="tag tag-warn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        维修
      </span>
      <span class="tag tag-x" title="暂不可用">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </span>
    </div>

    <div class="game-row">
      <div class="game-name">MC 我的世界</div>
      <span class="tag tag-play" onclick="openGame()">玩</span>
    </div>

    <div class="copyright">予墨 · © 2026</div>
  </section>
</div>

<!-- 游戏内视图 -->
<section id="game-view">
  <div class="game-top">
    <div class="gbtn" onclick="closeGame()">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      返回
    </div>
    <div class="gbtn" onclick="toggleFullscreen()">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>
      全屏
    </div>
  </div>
  <iframe id="game-frame" src="about:blank" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
</section>

<!-- 访客进入码弹窗 -->
<div class="modal-mask" id="guestModal">
  <div class="modal">
    <div class="close-x" onclick="document.getElementById('guestModal').classList.remove('show')">×</div>
    <h3>访客进入码</h3>
    <input type="password" class="code-input" id="guestCode" placeholder="进入码" inputmode="numeric">
    <button class="modal-ok" onclick="checkGuestCode()">确 定</button>
    <div class="err-tip" id="guestErr"></div>
  </div>
</div>

<!-- 管理员悬浮按钮 -->
<div id="adminFab">菜单</div>
<!-- 管理员菜单面板 -->
<div id="adminPanel">
  <div class="close-x" onclick="toggleAdminPanel(false)">×</div>
  <div class="panel-title">账号列表</div>
  <div id="accList"></div>
</div>

<script src="script.js"></script>
</body>
</html>
